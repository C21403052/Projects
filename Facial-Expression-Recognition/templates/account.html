<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.css') }}">

</head>
<body>
    <div class="nav-top-left">
        <a href="/" class="back-button"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <div class="nav-center">
        {{ user_name }}
    </div>

    <div class="nav-top-right">
        <a href="{{ url_for('logout') }}" class="btn-auth">Logout</a>
    </div>

    <div class="container" style="margin-top: 10px; width: 90%;">
        <h2>Your Sessions</h2>
        <table class="sessions-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Duration</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                {% for s in sessions %}
                    <tr>
                        <td>{{ s.session_name }}</td>
                        <td>{{ s.duration }}</td>
                        <td>{{ s.created_at }}</td>
                        <td class="action-buttons">
                            <!-- Buttons for rename/delete -->
                            <button class="action-button rename-btn"
                                    onclick="renameSession({{ s.session_id }})">
                                Rename
                            </button>
                            <button class="action-button delete-btn"
                                    onclick="deleteSession({{ s.session_id }})">
                                Delete
                            </button>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
    </div>
    <script>
    function renameSession(sessionId) {
        // Variable to check for invalid characters
        const invalidChars = /[\\\/:\*\?"<>\|]/;

        // Pop up an input
        let newName = prompt("Enter a new name for this session:");
        if (newName) {
            // Check for invalid characters
            if (invalidChars.test(newName)) {
              alert("That name contains invalid characters (\\ / : * ? \" < > |). Please try again.");
              return;
            }

            // Call rename route
            fetch("{{ url_for('rename_session') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId, new_name: newName })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    alert(data.message);
                    location.reload();
                } else {
                    alert(data.message);
                }
            })
            .catch(err => console.error(err));
        }
    }

    function deleteSession(sessionId) {
        if (confirm("Are you sure you want to delete this session?")) {
            fetch("{{ url_for('delete_session') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    alert(data.message);
                    location.reload();
                } else {
                    alert(data.message);
                }
            })
            .catch(err => console.error(err));
        }
    }
    </script>
</body>
</html>
